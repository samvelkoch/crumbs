<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Приватность: браузеру запрещено ходить куда-либо, кроме самого сайта. Данные не могут уйти наружу. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Агентство Медка и Пуси</title>
  <meta name="description" content="Дневник еды и кожи в игровой форме. Данные остаются на устройстве.">
  <meta name="theme-color" content="#6d28d9">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Агентство">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app" id="app">
    <noscript>Для работы нужен JavaScript.</noscript>
  </div>
  <nav class="tabbar hidden" id="tabbar" aria-label="Разделы">
    <div class="tabbar-inner">
      <button class="tab" data-tab="today"><span class="ico">🏠</span>Сегодня</button>
      <button class="tab" data-tab="diary"><span class="ico">📅</span>Дневник</button>
      <button class="tab" data-tab="radar"><span class="ico">🔎</span>Радар</button>
      <button class="tab" data-tab="games"><span class="ico">🎮</span>Игры</button>
      <button class="tab" data-tab="more"><span class="ico">⭐</span>Агентство</button>
    </div>
  </nav>
  <dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
